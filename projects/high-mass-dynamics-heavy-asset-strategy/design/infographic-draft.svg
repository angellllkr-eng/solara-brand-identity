<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
<title id="title">High-Mass Dynamics &amp; Heavy Asset Strategy</title>
<desc id="desc">Editorial infographic separating vehicle engineering, heavy-vehicle stopping-distance fundamentals, and dated U.S. fixed-income index yields.</desc>
<defs>
 <style>
 .bg{fill:#f5f1e8}.ink{fill:#20231f}.muted{fill:#686b63}.gold{fill:#b88736}.rule{stroke:#d3cbbb;stroke-width:2}.panel{fill:#fffdf8;stroke:#d8d0c2;stroke-width:2}.kicker{font:700 16px Arial,sans-serif;letter-spacing:3px}.hero{font:700 62px Arial,sans-serif;letter-spacing:-2px}.sub{font:400 23px Arial,sans-serif}.h2{font:700 27px Arial,sans-serif}.h3{font:700 20px Arial,sans-serif}.body{font:400 17px Arial,sans-serif}.small{font:400 14px Arial,sans-serif}.num{font:700 48px Arial,sans-serif;letter-spacing:-1px}.label{font:700 13px Arial,sans-serif;letter-spacing:1.5px}
 </style>
</defs>
<rect class="bg" width="1200" height="1800"/>
<rect x="72" y="66" width="56" height="7" class="gold"/>
<text x="72" y="110" class="kicker ink">ENGINEERING / RISK / EVIDENCE</text>
<text x="72" y="190" class="hero ink">HIGH-MASS</text>
<text x="72" y="258" class="hero ink">DYNAMICS</text>
<text x="72" y="315" class="h2 gold">&amp; HEAVY ASSET STRATEGY</text>
<text x="72" y="365" class="sub muted">Mass changes the system. Evidence changes the decision.</text>
<line x1="72" y1="408" x2="1128" y2="408" class="rule"/>
<text x="72" y="450" class="kicker muted">01 / PERFORMANCE ENGINEERING</text>
<rect x="72" y="478" width="1056" height="310" rx="20" class="panel"/>
<text x="108" y="528" class="label gold">PORSCHE · FLACHBAU RS · 2026 ONE-OFF</text>
<text x="108" y="594" class="num ink">554 kg</text>
<text x="108" y="625" class="h3 ink">Rear-axle downforce</text>
<text x="108" y="657" class="body muted">At 340 km/h · High Downforce setup</text>
<line x1="108" y1="684" x2="1090" y2="684" class="rule"/>
<text x="108" y="721" class="body ink">Specific to a customer-built 991.2 911 GT2 RS transformation;</text>
<text x="108" y="749" class="body ink">not a general Porsche specification or total downforce figure.</text>
<rect x="72" y="812" width="510" height="238" rx="20" class="panel"/>
<text x="104" y="857" class="label gold">LAMBORGHINI · TEMERARIO</text>
<text x="104" y="921" class="num ink">1,690 kg</text>
<text x="104" y="953" class="h3 ink">Dry weight</text>
<text x="104" y="985" class="small muted">2026 digital brochure specification.</text>
<text x="104" y="1013" class="small muted">Not curb weight; market spec needs final check.</text>
<rect x="602" y="812" width="526" height="238" rx="20" class="panel"/>
<text x="634" y="857" class="label gold">ASTON MARTIN · VALHALLA</text>
<text x="634" y="921" class="num ink">12 kg</text>
<text x="634" y="953" class="h3 ink">Unsprung-mass reduction</text>
<text x="634" y="985" class="small muted">Optional magnesium wheels.</text>
<text x="634" y="1013" class="small muted">Component mass, not whole-vehicle savings.</text>
<text x="72" y="1100" class="kicker muted">02 / HEAVY-VEHICLE STOPPING MODEL</text>
<rect x="72" y="1128" width="1056" height="224" rx="20" class="panel"/>
<text x="108" y="1186" class="h2 ink">d ≈ v tᵣ + v² / (2 μ g)</text>
<text x="108" y="1228" class="body ink">Reaction distance + idealized braking distance on a level road.</text>
<text x="108" y="1265" class="small muted">v = initial speed · tᵣ = reaction time · μ = assumed friction coefficient · g = gravity</text>
<text x="108" y="1303" class="small muted">Simplified model only: grade, load, tires, brake condition, temperature and ABS</text>
<text x="108" y="1327" class="small muted">behavior change real outcomes. Not a certification or operating-safety calculator.</text>
<text x="72" y="1410" class="kicker muted">03 / FIXED-INCOME CONTEXT · U.S. INDEX OBSERVATIONS</text>
<rect x="72" y="1438" width="510" height="204" rx="20" class="panel"/>
<text x="104" y="1480" class="label gold">CMBS INVESTMENT GRADE</text>
<text x="104" y="1547" class="num ink">≈ 4.65%</text>
<text x="104" y="1581" class="body ink">Bloomberg U.S. CMBS IG Index</text>
<text x="104" y="1612" class="small muted">As of 31 Mar 2026 · reported by Capital Group</text>
<rect x="602" y="1438" width="526" height="204" rx="20" class="panel"/>
<text x="634" y="1480" class="label gold">ASSET-BACKED SECURITIES</text>
<text x="634" y="1547" class="num ink">≈ 4.40%</text>
<text x="634" y="1581" class="body ink">Bloomberg U.S. ABS Index</text>
<text x="634" y="1612" class="small muted">As of 31 Mar 2026 · reported by Capital Group</text>
<line x1="72" y1="1675" x2="1128" y2="1675" class="rule"/>
<text x="72" y="1710" class="small ink">Historical index observations—not live quotes, forecasts or guaranteed returns.</text>
<text x="72" y="1738" class="small muted">Sources: Porsche Newsroom · Lamborghini 2026 digital brochure · Aston Martin Valhalla</text>
<text x="72" y="1762" class="small muted">Capital Group (Bloomberg / J.P. Morgan, 2026-03-31) · FHWA Pilot/Escort Training Manual</text>
<text x="1128" y="1762" text-anchor="end" class="label gold">REVIEW DRAFT · 2026-10-11</text>
</svg>