<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0A1628"/>
<meta name="description" content="SOLARA Brand Identity — dual directions Radiant Precision + Terra Lumen. Exclusive for A.K. / A11-K."/>
<meta name="author" content="Angel L. Krastev / A11-K"/>
<meta name="robots" content="noindex, nofollow"/>
<title>SOLARA Brand Identity — A11-K</title>
<style>
  :root{--bg:#0A1628;--gold:#F5C518;--fg:#f4f4f0;--muted:#9aa3b2;--card:#0d1c33;--border:#1e2a3d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;min-height:100dvh}
  header{padding:2.5rem 1.5rem 1.25rem;text-align:center;border-bottom:1px solid var(--border)}
  h1{letter-spacing:.14em;font-weight:650;margin:0 0 .4rem;font-size:clamp(1.6rem,4vw,2.1rem)}
  .sub{color:var(--muted);font-size:.92rem;margin:.25rem 0}
  a{color:var(--gold);text-decoration:none}
  a:hover{text-decoration:underline}
  main{max-width:1100px;margin:0 auto;padding:1.5rem 1.25rem 2.5rem}
  h2{font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:2.2rem 0 .9rem;font-weight:700}
  .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
  figure{margin:0;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s}
  figure:hover{border-color:rgba(245,197,24,.35)}
  figure img,figure video{width:100%;display:block;aspect-ratio:auto}
  figcaption{padding:.7rem .95rem;font-size:.8rem;color:var(--muted)}
  footer{text-align:center;padding:2rem 1rem;color:var(--muted);font-size:.78rem;border-top:1px solid var(--border)}
  .badge{display:inline-block;background:rgba(245,197,24,.12);color:var(--gold);font-size:.7rem;font-weight:650;padding:.25rem .6rem;border-radius:999px;margin-top:.6rem;letter-spacing:.04em}
</style>
</head>
<body>
<header>
  <h1>SOLARA</h1>
  <p class="sub">Two brand directions · Radiant Precision · Terra Lumen</p>
  <p class="sub"><a href="https://github.com/angellllkr-eng/solara-brand-identity">GitHub</a> · A11-K / Mind-Reply</p>
  <div class="badge">EXCLUSIVE · A.K.</div>
</header>
<main>
  <h2>Direction 1 — Radiant Precision</h2>
  <div class="g">
    <figure><img src="solara_dir1_logo_system.png" alt="Radiant Precision logo system" loading="lazy"/><figcaption>Logo system</figcaption></figure>
    <figure><img src="solara_dir1_color_palette.png" alt="Radiant Precision palette" loading="lazy"/><figcaption>Color palette</figcaption></figure>
    <figure><img src="solara_dir1_typography.png" alt="Radiant Precision type" loading="lazy"/><figcaption>Typography</figcaption></figure>
  </div>
  <h2>Direction 2 — Terra Lumen</h2>
  <div class="g">
    <figure><img src="solara_dir2_logo_system.png" alt="Terra Lumen logo system" loading="lazy"/><figcaption>Logo system</figcaption></figure>
    <figure><img src="solara_dir2_color_palette.png" alt="Terra Lumen palette" loading="lazy"/><figcaption>Color palette</figcaption></figure>
    <figure><img src="solara_dir2_typography.png" alt="Terra Lumen type" loading="lazy"/><figcaption>Typography</figcaption></figure>
  </div>
  <h2>Applications</h2>
  <div class="g">
    <figure><img src="solara_mockup_business_cards.png" alt="Business cards" loading="lazy"/><figcaption>Business cards</figcaption></figure>
    <figure><img src="solara_mockup_website_headers.png" alt="Website headers" loading="lazy"/><figcaption>Website headers</figcaption></figure>
    <figure><img src="solara_mockup_packaging.png" alt="Packaging" loading="lazy"/><figcaption>Packaging</figcaption></figure>
    <figure><img src="solara_mockup_marketing_posters.png" alt="Marketing posters" loading="lazy"/><figcaption>Marketing posters</figcaption></figure>
  </div>
  <h2>Motion</h2>
  <div class="g">
    <figure>
      <video src="solara_logo_animation.mp4" autoplay loop muted playsinline></video>
      <figcaption>Logo animation · 6s loop</figcaption>
    </figure>
  </div>
</main>
<footer>
  SOLARA · Exclusive to A.K. / A11-K<br>
  Live: <a href="https://cdn.jsdelivr.net/gh/angellllkr-eng/solara-brand-identity@main/index.html">jsDelivr</a> · <a href="https://github.com/angellllkr-eng/solara-brand-identity">GitHub</a>
</footer>
</body>
</html>
