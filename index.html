<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SOLARA Brand Identity — A11-K</title>
<style>
  :root{--bg:#0A1628;--gold:#F5C518;--fg:#f4f4f0;--muted:#9aa3b2}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:2.5rem 1.5rem 1rem;text-align:center;border-bottom:1px solid #1e2a3d}
  h1{letter-spacing:.12em;font-weight:600;margin:0 0 .5rem}
  .sub{color:var(--muted);font-size:.95rem}
  a{color:var(--gold)}
  main{max-width:1100px;margin:0 auto;padding:1.5rem}
  h2{font-size:1rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:2rem 0 .75rem}
  .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
  figure{margin:0;background:#0d1c33;border:1px solid #1e2a3d;border-radius:12px;overflow:hidden}
  figure img,figure video{width:100%;display:block}
  figcaption{padding:.65rem .9rem;font-size:.8rem;color:var(--muted)}
  footer{text-align:center;padding:2rem;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header>
  <h1>SOLARA</h1>
  <p class="sub">Two brand directions · Radiant Precision · Terra Lumen</p>
  <p class="sub"><a href="https://github.com/angellllkr-eng/solara-brand-identity">GitHub</a> · A11-K / Mind-Reply</p>
</header>
<main>
  <h2>Direction 1 — Radiant Precision</h2>
  <div class="g">
    <figure><img src="solara_dir1_logo_system.png" alt="Dir1 logo"/><figcaption>Logo system</figcaption></figure>
    <figure><img src="solara_dir1_color_palette.png" alt="Dir1 palette"/><figcaption>Color palette</figcaption></figure>
    <figure><img src="solara_dir1_typography.png" alt="Dir1 type"/><figcaption>Typography</figcaption></figure>
  </div>
  <h2>Direction 2 — Terra Lumen</h2>
  <div class="g">
    <figure><img src="solara_dir2_logo_system.png" alt="Dir2 logo"/><figcaption>Logo system</figcaption></figure>
    <figure><img src="solara_dir2_color_palette.png" alt="Dir2 palette"/><figcaption>Color palette</figcaption></figure>
    <figure><img src="solara_dir2_typography.png" alt="Dir2 type"/><figcaption>Typography</figcaption></figure>
  </div>
  <h2>Applications</h2>
  <div class="g">
    <figure><img src="solara_mockup_business_cards.png" alt="Cards"/><figcaption>Business cards</figcaption></figure>
    <figure><img src="solara_mockup_website_headers.png" alt="Headers"/><figcaption>Website headers</figcaption></figure>
    <figure><img src="solara_mockup_packaging.png" alt="Packaging"/><figcaption>Packaging</figcaption></figure>
    <figure><img src="solara_mockup_marketing_posters.png" alt="Posters"/><figcaption>Marketing posters</figcaption></figure>
  </div>
  <h2>Motion</h2>
  <div class="g">
    <figure>
      <video src="solara_logo_animation.mp4" autoplay loop muted playsinline></video>
      <figcaption>Logo animation</figcaption>
    </figure>
  </div>
</main>
<footer>SOLARA · public on GitHub + jsDelivr</footer>
</body>
</html>
